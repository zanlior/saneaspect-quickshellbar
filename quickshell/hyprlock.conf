# Rendered with saved settings by scripts/backend.py when locking.
general {
    hide_cursor = true
}
background {
    monitor =
    path = @BACKGROUND@
    blur_passes = 3
    blur_size = @BLUR@
    brightness = 0.75
    color = rgba(080b0cff)
}
# Date and time at the upper center of the screen.
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(e6efe9d9)
    font_size = 18
    font_family = @FONT@
    position = 0, -11.5%
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +"@TIME_FORMAT@"
    color = rgba(e6efe9d9)
    font_size = @CLOCK_SIZE@
    font_family = @FONT@
    position = 0, -14.5%
    halign = center
    valign = top
}
# User badge, username and a translucent password pill near the bottom.
shape {
    monitor =
    size = 60, 60
    rounding = -1
    color = rgba(ffffff22)
    border_size = 1
    border_color = rgba(ffffff66)
    position = 0, 17%
    halign = center
    valign = bottom
}
label {
    monitor =
    text = 
    color = rgba(ffffffff)
    font_size = 20
    font_family = @ICON_FONT@
    position = 0, 18.5%
    halign = center
    valign = bottom
}
label {
    monitor =
    text = $USER
    color = rgba(ffffffff)
    font_size = 14
    font_family = @FONT@
    position = 0, 13%
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 196, 32
    outline_thickness = 1
    outer_color = rgba(ffffff33)
    inner_color = rgba(ffffff33)
    font_color = rgba(ffffffff)
    check_color = rgba(ffffff66)
    fail_color = rgba(d9838366)
    font_family = @FONT@
    placeholder_text = Enter password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.32
    dots_spacing = 0.2
    rounding = 16
    position = 0, 8.5%
    halign = center
    valign = bottom
}
